<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devansh Goel — Portfolio</title>

  <!-- JetBrains Mono for the small UI bits (nav, wipe label). The slides themselves are images. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ══════════════════════════════════════════════════════════
       LAYER 0 — BACKGROUND (fixed)
       ══════════════════════════════════════════════════════════ -->
  <div id="bg" aria-hidden="true"></div>


  <!-- ══════════════════════════════════════════════════════════
       LAYER 1 — STAGE (fixed, never scrolls)
       #frame is the 1302 × 842 slide window, scaled to fill the screen.
       #strip holds every slide image stacked vertically; scrolling
       moves the strip up inside the frame (see main.js). Animated
       layers (render sequences, the wheel, labels) live in the strip too.
       ══════════════════════════════════════════════════════════ -->
  <div id="stage">
    <div id="backdrops"></div>   <!-- full-screen background photos (main.js) -->
    <div id="frame">
      <div id="strip"></div>
    </div>
  </div>


  <!-- LAYER 1.5 — CIRCUIT SPARKS: tiny sparks running along a hidden circuit
       board, lighting up the traces around them (drawn by main.js, part 5) -->
  <canvas id="pcb" aria-hidden="true"></canvas>


  <!-- LAYER 2 — GLITCH CANVAS (short bursts, drawn by main.js) -->
  <canvas id="glitch" aria-hidden="true"></canvas>


  <!-- LAYER 3 — PROJECT WIPE (the orange screen between projects) -->
  <div id="transition" aria-hidden="true">
    <div id="transition-label"></div>
  </div>


  <!-- LAYER 4 — CONTENTS → NAV MORPH
       Copies of the four Contents tiles that fly up into the nav bar
       as you leave the Contents page (built by main.js). -->
  <div id="morph" aria-hidden="true"></div>


  <!-- LAYER 5 — DIGITAL PATTERN OVERLAY (fixed, permanent filter, never scrolls) -->
  <div id="overlay" aria-hidden="true"></div>


  <!-- UI — semi-transparent top bar. The slides sit below it. The nav inside it
       is hidden during the intro and revealed by the Contents morph. -->
  <header id="topbar">
    <button id="brand" type="button">Devansh Goel</button>
    <nav id="project-nav"></nav>
  </header>
  <div id="progress-bar"></div>
  <div id="scroll-hint">
    <div class="chevron"></div>
    <div class="scroll-label">Scroll</div>
  </div>


  <!-- SCROLL SPACER — its height creates the scroll distance.
       main.js sets it from the holds + transitions in the config.
       (On mobile / reduced motion the slides are placed in here instead.) -->
  <main id="scroll-root"></main>


  <!-- SCRIPTS: GSAP + ScrollTrigger, then the site. No server needed —
       everything else is local, so you can just double-click this file. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="slides/manifest.js"></script>       <!-- written by tools/figma_export.py -->
  <script src="slides/backdrops.js"></script>      <!-- written by tools/make_backdrops.py -->
  <script src="sequences/sequences.js"></script>   <!-- written by tools/build_sequences.py -->
  <script src="main.js"></script>

  <!-- VISIT COUNTER (GoatCounter, no cookies): dashboard at https://devanshgoel.goatcounter.com
       Send each application its own link, e.g. yoursite.com/?ref=dyson — it shows up
       as its own page ("/ref/dyson") in the dashboard. Visits from your own computer
       (localhost / opening the file) aren't counted. -->
  <script>
    window.goatcounter = {
      path: function () {
        var ref = new URLSearchParams(location.search).get("ref");
        return ref ? "/ref/" + ref.toLowerCase().replace(/[^a-z0-9_-]/g, "") : location.pathname;
      },
    };
  </script>
  <script data-goatcounter="https://devanshgoel.goatcounter.com/count"
          async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
